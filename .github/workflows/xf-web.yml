name: XpressFlow Prepress web

on:
  push:
    branches: [xf/prepress]
    tags: ["xf-web-*"]
  workflow_dispatch:

permissions:
  contents: write # the release upload on a tag

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
      - name: Build the web app
        run: cd apps/pdfcraft-web && trunk build --release
      - name: Zip dist/web (files at the zip root; viewer/get_pdfcraft.py --fork unpacks this)
        run: |
          test -f dist/web/index.html
          (cd dist/web && zip -qr9 "$GITHUB_WORKSPACE/xpressflow-prepress-web.zip" .)
          ls -lh xpressflow-prepress-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: xpressflow-prepress-web
          path: xpressflow-prepress-web.zip
      - name: Release asset (tags only)
        if: startsWith(github.ref, 'refs/tags/xf-web-')
        uses: softprops/action-gh-release@v2
        with:
          files: xpressflow-prepress-web.zip
